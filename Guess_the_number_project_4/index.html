<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: rgb(0, 0, 0); color:#fff;">

    <div class="wrapper">
        <h1>Number Guessing Game</h1>
        <p>Guess a random number between 1 to 100.</p>
        <p>You have 8 attempts to guess the right number.</p>
    <br>
    
    <form class="form">
        <label for="guessField" id="guess">Guess a number</label>
        <input type="text" id="guessField" class="guessField">
        <input type="submit" id="subt" value="Submit Guess">
    </form>
    
    <div class="resultParas">
        <p>previous guesses: <span class="guesses"></span></p>
        <p>Guesses Remaining: <span class="lastResult">6</span></p>
        <p class="lowOrHi"></p>
    </div>
    
    </div>

    <script src="script.js"></script>
    
</body>
</html>
